<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 3200 900" role="img" aria-labelledby="title desc">
  <title id="title">Continuous engineering world</title>
  <desc id="desc">A connected illustrated landscape moving from mobile engineering through applied AI and enterprise systems to a personal portfolio studio.</desc>
  <rect width="3200" height="900" fill="#f8f9fb"/>

  <!-- shared horizon and route -->
  <path d="M0 690 H3200" stroke="#d8dde7" stroke-width="2"/>
  <path d="M60 650 C320 560 520 760 790 650 S1260 540 1540 650 S2050 760 2310 650 S2800 540 3140 650"
        fill="none" stroke="#18202a" stroke-width="14" stroke-linecap="square"/>
  <path d="M60 650 C320 560 520 760 790 650 S1260 540 1540 650 S2050 760 2310 650 S2800 540 3140 650"
        fill="none" stroke="#315be8" stroke-width="4" stroke-dasharray="26 22"/>

  <!-- scene 1: mobile engineering -->
  <g transform="translate(120 125)">
    <polygon points="90,520 320,400 560,520 325,645" fill="#eef1f7" stroke="#18202a" stroke-width="5"/>
    <polygon points="240,370 410,285 500,330 330,420" fill="#cfd8ff" stroke="#18202a" stroke-width="5"/>
    <polygon points="330,420 500,330 500,505 330,595" fill="#ffffff" stroke="#18202a" stroke-width="5"/>
    <polygon points="240,370 330,420 330,595 240,540" fill="#e2e8ff" stroke="#18202a" stroke-width="5"/>
    <rect x="354" y="376" width="115" height="160" fill="#18202a"/>
    <rect x="367" y="392" width="89" height="126" fill="#f8f9fb"/>
    <rect x="382" y="410" width="58" height="10" fill="#315be8"/>
    <rect x="382" y="435" width="38" height="8" fill="#9db0ff"/>
    <rect x="382" y="455" width="60" height="8" fill="#d8dde7"/>
    <rect x="382" y="475" width="45" height="8" fill="#d8dde7"/>
    <rect x="285" y="255" width="42" height="85" fill="#315be8" stroke="#18202a" stroke-width="4"/>
    <circle cx="306" cy="322" r="5" fill="#f8f9fb"/>
    <path d="M530 510 l60 -32 55 28 -59 32z" fill="#ffffff" stroke="#18202a" stroke-width="4"/>
    <path d="M548 492 l21 -11 20 10 -21 12z" fill="#315be8"/>
    <circle cx="178" cy="495" r="32" fill="#cfd8ff" stroke="#18202a" stroke-width="5"/>
    <path d="M178 463 v64 M146 495 h64" stroke="#315be8" stroke-width="7"/>
  </g>

  <!-- connector towers -->
  <g fill="#eef1f7" stroke="#18202a" stroke-width="5">
    <polygon points="760,590 820,560 880,590 820,620"/>
    <polygon points="820,560 880,590 880,440 820,410"/>
    <polygon points="760,590 820,620 820,410 760,440"/>
  </g>
  <rect x="805" y="465" width="30" height="28" fill="#315be8"/>

  <!-- scene 2: applied AI -->
  <g transform="translate(880 110)">
    <polygon points="80,535 325,410 580,535 330,665" fill="#eef1f7" stroke="#18202a" stroke-width="5"/>
    <circle cx="330" cy="390" r="150" fill="#ffffff" stroke="#18202a" stroke-width="6"/>
    <circle cx="330" cy="390" r="76" fill="#cfd8ff" stroke="#315be8" stroke-width="8"/>
    <circle cx="330" cy="390" r="24" fill="#315be8"/>
    <g stroke="#18202a" stroke-width="5" fill="#f8f9fb">
      <line x1="330" y1="314" x2="245" y2="250"/><circle cx="230" cy="238" r="22"/>
      <line x1="397" y1="350" x2="485" y2="310"/><circle cx="505" cy="300" r="22"/>
      <line x1="404" y1="430" x2="495" y2="480"/><circle cx="515" cy="492" r="22"/>
      <line x1="264" y1="435" x2="175" y2="490"/><circle cx="156" cy="501" r="22"/>
      <line x1="275" y1="330" x2="185" y2="300"/><circle cx="164" cy="292" r="22"/>
    </g>
    <path d="M250 390 q80 -120 160 0 q-80 120 -160 0z" fill="none" stroke="#315be8" stroke-width="10"/>
    <rect x="105" y="540" width="104" height="55" fill="#18202a"/>
    <rect x="122" y="553" width="70" height="10" fill="#315be8"/>
    <rect x="448" y="535" width="104" height="60" fill="#18202a"/>
    <rect x="467" y="550" width="65" height="10" fill="#315be8"/>
  </g>

  <!-- scene 3: enterprise + public scale -->
  <g transform="translate(1650 120)">
    <polygon points="65,520 320,390 600,525 335,665" fill="#eef1f7" stroke="#18202a" stroke-width="5"/>
    <g stroke="#18202a" stroke-width="5">
      <polygon points="135,430 230,382 300,420 205,470" fill="#cfd8ff"/>
      <polygon points="205,470 300,420 300,555 205,607" fill="#ffffff"/>
      <polygon points="135,430 205,470 205,607 135,565" fill="#e2e8ff"/>
      <rect x="226" y="455" width="48" height="20" fill="#315be8" stroke="none"/>
      <rect x="226" y="490" width="48" height="20" fill="#18202a" stroke="none"/>
      <rect x="226" y="525" width="48" height="20" fill="#9db0ff" stroke="none"/>

      <polygon points="340,390 455,330 535,372 418,435" fill="#cfd8ff"/>
      <polygon points="418,435 535,372 535,555 418,620" fill="#ffffff"/>
      <polygon points="340,390 418,435 418,620 340,575" fill="#e2e8ff"/>
    </g>
    <g fill="#315be8">
      <rect x="445" y="435" width="58" height="12"/>
      <rect x="445" y="465" width="38" height="12"/>
      <rect x="445" y="495" width="66" height="12"/>
    </g>
    <path d="M300 488 C332 468 350 454 380 444" fill="none" stroke="#315be8" stroke-width="7"/>
    <circle cx="300" cy="488" r="10" fill="#315be8"/>
    <circle cx="380" cy="444" r="10" fill="#315be8"/>

    <!-- public-service verification terminal -->
    <rect x="88" y="250" width="150" height="104" fill="#ffffff" stroke="#18202a" stroke-width="5"/>
    <circle cx="128" cy="300" r="22" fill="#cfd8ff" stroke="#18202a" stroke-width="4"/>
    <path d="M118 300 l8 8 18 -20" fill="none" stroke="#315be8" stroke-width="7"/>
    <rect x="164" y="276" width="48" height="10" fill="#18202a"/>
    <rect x="164" y="298" width="35" height="8" fill="#9db0ff"/>
    <rect x="164" y="318" width="42" height="8" fill="#d8dde7"/>
  </g>

  <!-- scene 4: personal studio / handoff -->
  <g transform="translate(2430 105)">
    <polygon points="85,535 330,410 590,535 335,665" fill="#eef1f7" stroke="#18202a" stroke-width="5"/>
    <polygon points="175,390 330,312 470,385 315,468" fill="#cfd8ff" stroke="#18202a" stroke-width="5"/>
    <polygon points="315,468 470,385 470,548 315,635" fill="#ffffff" stroke="#18202a" stroke-width="5"/>
    <polygon points="175,390 315,468 315,635 175,555" fill="#e2e8ff" stroke="#18202a" stroke-width="5"/>
    <rect x="342" y="420" width="95" height="130" fill="#18202a"/>
    <rect x="357" y="437" width="65" height="94" fill="#f8f9fb"/>
    <circle cx="389" cy="466" r="20" fill="#cfd8ff"/>
    <rect x="370" y="494" width="39" height="8" fill="#315be8"/>
    <rect x="364" y="512" width="52" height="7" fill="#d8dde7"/>
    <circle cx="135" cy="515" r="38" fill="#315be8" stroke="#18202a" stroke-width="5"/>
    <path d="M117 515 h36 M135 497 v36" stroke="#f8f9fb" stroke-width="7"/>
    <path d="M525 505 l58 -30 52 26 -58 31z" fill="#ffffff" stroke="#18202a" stroke-width="4"/>
    <rect x="539" y="493" width="38" height="8" fill="#315be8"/>
  </g>

  <!-- subtle wayfinding nodes -->
  <g fill="#315be8" stroke="#f8f9fb" stroke-width="8">
    <circle cx="640" cy="650" r="18"/>
    <circle cx="1430" cy="650" r="18"/>
    <circle cx="2210" cy="650" r="18"/>
    <circle cx="2990" cy="650" r="18"/>
  </g>
</svg>